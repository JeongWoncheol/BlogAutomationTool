name: Bootstrap v8.08.52 source

on:
  push:
    paths:
      - '.github/workflows/bootstrap-v852.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-v852:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v8.08.52 safely
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          WORK=/tmp/nblog-v852
          rm -rf "$WORK"
          mkdir -p "$WORK"

          # v8.08.50 CLEAN runtime existed in this repository history.
          git show 5165f6d3fcaa0015f17a4be6c89a2c7d0fb0a70b:NBlog_v8_08_50_CLEAN_RUNTIME_FINAL.zip > /tmp/v850.zip
          unzip -q /tmp/v850.zip -d "$WORK"

          # Apply the locally validated v8.08.50 -> v8.08.52 delta.
          base64 -d "$ROOT/.github/bootstrap/v850_to_v852.patch.xz.b64" > /tmp/v852.patch.xz
          xz -dc /tmp/v852.patch.xz > /tmp/v852.patch
          cd "$WORK"
          patch -p2 --batch < /tmp/v852.patch

          test -f app.py
          test -f modules/content_adapter.py
          test -f V8_08_52_OLLAMA_HUMAN_TONE_FIX_KR.md

          # Never publish credentials, local state, histories or generated output.
          rm -f data/studio.db data/studio.db-* || true
          rm -f data/blog_upload_history.json data/published_product_registry.json || true
          rm -f data/*credentials*.json data/*credential*.json data/*secret*.json || true
          rm -f data/coupang_partners_credentials.json data/naver_image_api_credentials.json || true
          rm -f data/toss_sharelink_api_credentials.json data/openai_api_credentials.json || true
          rm -f .env .env.* || true
          rm -rf logs outputs evidence captures temp tmp __pycache__ modules/__pycache__ || true

          # Sanitize developer-specific Chrome profile while keeping all v8.08.52 defaults.
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/settings.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['chrome_profile'] = ''
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          # Replace repository working tree with reconstructed source.
          cd "$ROOT"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$WORK"/. "$ROOT"/

          cat > .gitignore <<'EOF'
          # Python
          __pycache__/
          *.py[cod]
          *.pyo
          .venv/
          venv/
          env/
          # IDE / OS
          .vscode/
          .idea/
          .DS_Store
          Thumbs.db
          desktop.ini
          # Runtime output and diagnostics
          outputs/
          logs/
          evidence/
          captures/
          temp/
          tmp/
          *.log
          blog_upload_diagnostic*.csv
          image_collect_diagnostic*.csv
          # Local databases / browser state
          data/studio.db
          data/studio.db-*
          *.sqlite
          *.sqlite3
          SingletonLock
          SingletonSocket
          SingletonCookie
          DevToolsActivePort
          # User-specific history/state
          data/blog_upload_history.json
          data/published_product_registry.json
          # Credentials — NEVER commit
          data/*credentials*.json
          data/*credential*.json
          data/coupang_partners_credentials.json
          data/naver_image_api_credentials.json
          data/toss_sharelink_api_credentials.json
          data/openai_api_credentials.json
          .env
          .env.*
          !.env.example
          # Generated image/video artifacts
          *.mp4
          *.webm
          *.avi
          *.mov
          EOF

          cat > README.md <<'EOF'
          # BlogAutomationTool

          Naver Blog Automation Studio **v8.08.52** source tree for collaborative development.

          ## Main features
          - Product/trend collection and content workflow
          - Exact-product 3-image collection with Coupang / NAVER Image API HUB / Google fallback validation
          - Naver SmartEditor draft automation
          - Ollama local AI content generation with conversational Korean tone checks
          - Celebrity outfit trend discovery and evidence-assisted analysis
          - Toss / Coupang / NAVER integration helpers
          - Optional local video workflow

          ## Quick start on Windows
          1. Run `01_INSTALL.cmd`
          2. Run `15_INSTALL_NORMAL_CHROME_EXTENSION.cmd`
          3. Configure only the integrations you use
          4. Run `START_STUDIO.cmd`

          Credentials, browser state and local databases are intentionally excluded. Current collaborative baseline: **v8.08.52**.
          EOF

          cat > CONTRIBUTING.md <<'EOF'
          # Contributing

          1. Pull the latest `main`.
          2. Create a branch for one feature or bug fix.
          3. Keep credentials and runtime data out of commits.
          4. Run `python -m py_compile app.py chrome_bridge.py chrome_profile.py stable_extension.py modules/*.py` before committing.
          5. Open a Pull Request describing reproduction, root cause, fix and validation.

          Never commit API credentials, browser profiles/cookies, `data/studio.db`, upload history, personal registry, diagnostics or generated media.
          EOF

          # Extra secret guard before commit.
          if find . -type f \( -iname '*credential*.json' -o -name 'studio.db' -o -name 'blog_upload_history.json' -o -name 'published_product_registry.json' \) | grep -q .; then
            echo 'Unsafe runtime/private file detected; aborting.' >&2
            find . -type f \( -iname '*credential*.json' -o -name 'studio.db' -o -name 'blog_upload_history.json' -o -name 'published_product_registry.json' \)
            exit 1
          fi

      - name: Commit v8.08.52 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: upload v8.08.52 collaborative baseline'
          git push origin HEAD:main
